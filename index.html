<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sulok: Smarter Customer Segmentation. Greater Value.</title>
<meta name="description" content="Sulok uses AI-powered customer behavior intelligence to discover smarter segments, understand customer needs and create value-driven marketing strategies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#7B6CFF;
  --purple-dark:#5B4FE0;
  --purple-deep:#4638C2;
  --navy:#0F1B3D;
  --navy-soft:#1B2A55;
  --lav:#E9E8FF;
  --bg:#F3F5FA;
  --white:#FFFFFF;
  --ink:#0F1B3D;
  --ink-soft:#4B5573;
  --ink-faint:#8891AB;
  --line:#E3E7F1;
  --good:#2FAE73;
  --warn:#D99A31;
  --bad:#D9556F;
  --r-card:20px;
  --r-lg:28px;
  --r-btn:12px;
  --r-in:12px;
  --shadow-sm: 0 1px 2px rgba(15,27,61,.05), 0 1px 1px rgba(15,27,61,.04);
  --shadow-md: 0 8px 24px rgba(15,27,61,.08);
  --shadow-lg: 0 20px 48px rgba(15,27,61,.14);
  --font-en:'Plus Jakarta Sans', system-ui, sans-serif;
  --font-ar:'IBM Plex Sans Arabic','Plus Jakarta Sans', system-ui, sans-serif;
  --maxw:1180px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth; scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-en); -webkit-font-smoothing:antialiased; min-height:100%;}
html[dir="rtl"] body{font-family:var(--font-ar);}
img,svg{max-width:100%;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-0.01em;}
p{margin:0;}
:focus-visible{outline:2.5px solid var(--purple); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

.wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px;}
@media (max-width:720px){ .wrap{padding:0 18px;} }

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:var(--r-btn); padding:12px 22px; font-weight:600; font-size:14.5px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, background .15s ease; white-space:nowrap;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:linear-gradient(135deg,var(--purple),var(--purple-deep)); color:#fff; box-shadow:0 8px 20px rgba(123,108,255,.32);}
.btn-primary:hover{box-shadow:0 10px 26px rgba(123,108,255,.42);}
.btn-dark{background:var(--navy); color:#fff;}
.btn-dark:hover{background:var(--navy-soft);}
.btn-ghost{background:transparent; color:var(--navy); border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--purple); color:var(--purple-deep);}
.btn-text{background:transparent; color:var(--navy); padding:10px 6px;}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:10px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}

/* ---------- badges / tags ---------- */
.tag{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 11px; border-radius:999px; background:var(--lav); color:var(--purple-deep);}
.tag-demo{background:#FFF3DD; color:#8A5F0E;}
.tag-good{background:#E3F7EC; color:#1D8656;}
.tag-bad{background:#FBE7EB; color:#B3405A;}
.tag-navy{background:var(--navy); color:#fff;}
.eyebrow{font-size:12.5px; font-weight:600; color:var(--purple-deep); display:flex; align-items:center; gap:8px;}
.eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--purple);}

/* ---------- cards ---------- */
.card{background:#fff; border:1px solid var(--line); border-radius:var(--r-card); box-shadow:var(--shadow-sm);}
.card-pad{padding:24px;}

/* ---------- logo ---------- */
.logo{display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; color:var(--navy);}
.logo .s-mark{flex:0 0 auto;}
.logo small{font-weight:600; color:var(--purple-deep); font-size:20px;}

/* =========================================================
   PUBLIC NAV
========================================================= */
.pub-nav{position:sticky; top:0; z-index:60; background:rgba(243,245,250,.82); backdrop-filter:blur(10px); border-bottom:1px solid transparent; transition:border-color .2s, background .2s;}
.pub-nav.scrolled{border-color:var(--line); background:rgba(255,255,255,.9);}
.pub-nav-inner{display:flex; align-items:center; justify-content:space-between; padding:16px 0;}
.pub-links{display:flex; gap:30px; align-items:center;}
.pub-links a{font-size:14.5px; font-weight:600; color:var(--ink-soft); padding:6px 0; border-bottom:2px solid transparent;}
.pub-links a:hover{color:var(--navy);}
.pub-nav-right{display:flex; align-items:center; gap:14px;}
.lang-switch{display:flex; align-items:center; gap:4px; font-size:13px; font-weight:700; color:var(--ink-soft); background:#fff; border:1px solid var(--line); border-radius:999px; padding:4px; }
.lang-switch button{border:none; background:transparent; padding:5px 10px; border-radius:999px; font-weight:700; font-size:12.5px; color:var(--ink-faint);}
.lang-switch button.active{background:var(--navy); color:#fff;}
.hamburger{display:none; flex-direction:column; gap:4px; background:none; border:none; padding:8px;}
.hamburger span{width:22px; height:2px; background:var(--navy); border-radius:2px;}
@media (max-width:980px){
  .pub-links{display:none;}
  .hamburger{display:flex;}
  .pub-nav-right .btn-ghost{display:none;}
}
.mobile-drawer{position:fixed; inset:0; background:rgba(15,27,61,.4); z-index:100; display:none;}
.mobile-drawer.open{display:block;}
.mobile-drawer-panel{position:absolute; inset-inline-end:0; top:0; bottom:0; width:82%; max-width:340px; background:#fff; padding:26px 22px; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow-lg);}
.mobile-drawer-panel a{padding:13px 6px; font-weight:600; font-size:16px; border-bottom:1px solid var(--line); color:var(--navy);}
.mobile-drawer-close{align-self:flex-end; background:none; border:none; font-size:22px; color:var(--ink-faint); padding:6px;}

/* =========================================================
   HERO
========================================================= */
.hero{position:relative; overflow:hidden; padding:76px 0 40px;}
.hero-blob{position:absolute; inset-inline-end:-180px; top:-140px; width:720px; height:720px; border-radius:50%; background:radial-gradient(circle at 30% 30%, rgba(123,108,255,.35), rgba(123,108,255,0) 68%); filter:blur(2px); pointer-events:none;}
.hero-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:56px; align-items:center; position:relative;}
@media (max-width:980px){ .hero-grid{grid-template-columns:1fr; gap:40px;} }
.hero h1{font-size:clamp(34px,4.6vw,56px); line-height:1.06; letter-spacing:-0.02em; color:var(--navy);}
.hero h1 .accent{background:linear-gradient(135deg,var(--purple),var(--purple-deep)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hero-sub{margin-top:20px; font-size:17px; line-height:1.6; color:var(--ink-soft); max-width:520px;}
.hero-ctas{display:flex; gap:14px; margin-top:30px; flex-wrap:wrap;}
.hero-meta{display:flex; gap:26px; margin-top:34px; flex-wrap:wrap;}
.hero-meta div{font-size:13px; color:var(--ink-faint);}
.hero-meta b{display:block; font-size:20px; color:var(--navy); font-weight:800;}

.loop-card{background:#fff; border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow-lg); padding:26px; position:relative;}
.loop-row{display:flex; align-items:center; gap:12px; padding:11px 6px; border-radius:14px; transition:background .25s;}
.loop-row.active{background:var(--lav);}
.loop-node{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--purple-deep); font-weight:700; font-size:13px; flex:0 0 auto; border:1px solid var(--line);}
.loop-row.active .loop-node{background:linear-gradient(135deg,var(--purple),var(--purple-deep)); color:#fff; border-color:transparent;}
.loop-text b{display:block; font-size:14.5px; color:var(--navy);}
.loop-text span{font-size:12.5px; color:var(--ink-faint);}
.loop-line{width:1.5px; height:14px; background:var(--line); margin-inline-start:23px;}

/* =========================================================
   SECTIONS (generic)
========================================================= */
.section{padding:84px 0;}
.section-tight{padding:56px 0;}
.section-dark{background:var(--navy); color:#fff;}
.section-head{max-width:640px; margin-bottom:44px;}
.section-head.center{margin-inline:auto; text-align:center;}
.section-head h2{font-size:clamp(26px,3.2vw,38px); color:var(--navy); line-height:1.15; margin-top:12px;}
.section-dark .section-head h2{color:#fff;}
.section-head p{margin-top:14px; font-size:16px; color:var(--ink-soft); line-height:1.6;}
.section-dark .section-head p{color:#B9C0DA;}

/* problem compare */
.compare{display:grid; grid-template-columns:1fr auto 1fr; gap:0; align-items:stretch;}
@media (max-width:800px){ .compare{grid-template-columns:1fr;} }
.compare-col{background:#fff; border:1px solid var(--line); padding:30px; }
.compare-col:first-child{border-radius:var(--r-lg) 0 0 var(--r-lg);}
.compare-col:last-child{border-radius:0 var(--r-lg) var(--r-lg) 0; background:var(--navy); color:#fff; border-color:var(--navy);}
@media (max-width:800px){ .compare-col:first-child{border-radius:var(--r-lg) var(--r-lg) 0 0;} .compare-col:last-child{border-radius:0 0 var(--r-lg) var(--r-lg);} }
.compare-arrow{display:flex; align-items:center; justify-content:center; width:56px; background:var(--bg); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
@media (max-width:800px){ .compare-arrow{width:auto; height:44px; border-inline:1px solid var(--line); border-top:none; border-bottom:none;} }
.compare-arrow svg{transform:rotate(0deg);}
html[dir="rtl"] .compare-arrow svg{transform:scaleX(-1);}
.compare-label{font-size:12.5px; font-weight:700; letter-spacing:.02em; color:var(--ink-faint); margin-bottom:16px;}
.compare-col:last-child .compare-label{color:#9AA4CC;}
.chip-row{display:flex; flex-wrap:wrap; gap:9px; margin-top:6px;}
.chip{padding:8px 14px; border-radius:10px; background:var(--bg); font-size:13.5px; font-weight:600; color:var(--ink-soft); border:1px solid var(--line);}
.chip-b{padding:9px 15px; border-radius:10px; background:rgba(123,108,255,.16); font-size:13.5px; font-weight:600; color:#D9D5FF; border:1px solid rgba(123,108,255,.35);}
.flow-mini{display:flex; align-items:center; gap:8px; margin-top:22px; font-size:13.5px; font-weight:600; color:var(--ink-faint); flex-wrap:wrap;}
.flow-mini b{color:var(--navy);}

/* value flow steps */
.flowsteps{display:grid; grid-template-columns:repeat(6,1fr); gap:14px;}
@media (max-width:980px){ .flowsteps{grid-template-columns:repeat(3,1fr);} }
@media (max-width:620px){ .flowsteps{grid-template-columns:1fr 1fr;} }
.flowstep{background:#fff; border:1px solid var(--line); border-radius:18px; padding:20px 16px; position:relative;}
.flowstep .fnum{font-size:12px; font-weight:800; color:#fff; background:linear-gradient(135deg,var(--purple),var(--purple-deep)); width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:14px;}
.flowstep h4{font-size:15px; color:var(--navy);}
.flowstep p{font-size:12.5px; color:var(--ink-faint); margin-top:6px; line-height:1.5;}

/* feature grid */
.feat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
@media (max-width:900px){ .feat-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:600px){ .feat-grid{grid-template-columns:1fr;} }
.feat-card{background:#fff; border:1px solid var(--line); border-radius:var(--r-card); padding:24px; transition:border-color .2s, box-shadow .2s;}
.feat-card:hover{border-color:#CFC9FF; box-shadow:var(--shadow-md);}
.feat-ic{width:42px; height:42px; border-radius:12px; background:var(--lav); display:flex; align-items:center; justify-content:center; margin-bottom:16px; color:var(--purple-deep);}
.feat-card h4{font-size:15.5px; color:var(--navy);}
.feat-card p{font-size:13.5px; color:var(--ink-faint); margin-top:8px; line-height:1.55;}

/* pricing */
.price-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
@media (max-width:980px){ .price-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:620px){ .price-grid{grid-template-columns:1fr;} }
.price-card{background:#fff; border:1px solid var(--line); border-radius:var(--r-lg); padding:26px; display:flex; flex-direction:column; gap:16px;}
.price-card.featured{border:1.5px solid var(--purple); box-shadow:0 16px 34px rgba(123,108,255,.2); position:relative;}
.price-card .pname{font-size:14px; font-weight:700; color:var(--purple-deep);}
.price-card .pdesc{font-size:12.5px; color:var(--ink-faint); min-height:32px;}
.price-card .pamt{font-size:32px; font-weight:800; color:var(--navy);}
.price-card .pamt span{font-size:13px; font-weight:600; color:var(--ink-faint);}
.price-list{display:flex; flex-direction:column; gap:9px; margin-top:6px;}
.price-list li{list-style:none; font-size:13px; color:var(--ink-soft); display:flex; gap:8px; align-items:flex-start;}
.price-list li svg{flex:0 0 auto; margin-top:2px; color:var(--good);}

/* footer */
.footer{background:var(--navy); color:#B9C0DA; padding:64px 0 30px;}
.footer-grid{display:grid; grid-template-columns:1.4fr repeat(5,1fr); gap:24px;}
@media (max-width:900px){ .footer-grid{grid-template-columns:1fr 1fr; row-gap:34px;} }
.footer h5{color:#fff; font-size:13px; margin-bottom:14px;}
.footer ul{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px;}
.footer a{font-size:13.5px; color:#B9C0DA;}
.footer a:hover{color:#fff;}
.footer-bottom{margin-top:50px; padding-top:24px; border-top:1px solid rgba(255,255,255,.12); display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; font-size:12.5px; color:#8A93BE;}

/* =========================================================
   COOKIE BANNER
========================================================= */
.cookie-bar{position:fixed; z-index:200; inset-inline:0; bottom:16px; display:flex; justify-content:center; padding:0 16px;}
.cookie-card{max-width:760px; width:100%; background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow-lg); padding:18px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.cookie-card p{font-size:13px; color:var(--ink-soft); flex:1 1 280px;}
.cookie-actions{display:flex; gap:8px; flex-wrap:wrap;}

/* =========================================================
   AUTH
========================================================= */
.auth-wrap{min-height:100vh; display:grid; grid-template-columns:1fr 1fr; }
@media (max-width:860px){ .auth-wrap{grid-template-columns:1fr;} }
.auth-visual{background:linear-gradient(155deg,var(--navy),#1a2b5c 60%, var(--purple-deep)); position:relative; display:flex; align-items:center; justify-content:center; padding:40px; overflow:hidden;}
@media (max-width:860px){ .auth-visual{display:none;} }
.auth-visual .blob{position:absolute; width:520px; height:520px; border-radius:50%; background:radial-gradient(circle,rgba(123,108,255,.5),transparent 70%); top:-120px; inset-inline-end:-160px;}
.auth-form-side{display:flex; align-items:center; justify-content:center; padding:40px 24px;}
.auth-box{width:100%; max-width:380px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; font-weight:600; color:var(--navy); margin-bottom:7px;}
.field input, .field select, .field textarea{width:100%; padding:12px 14px; border-radius:var(--r-in); border:1.5px solid var(--line); font-size:14px; font-family:inherit; background:#fff; color:var(--ink); transition:border-color .15s;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--purple);}
.field-hint{font-size:12px; color:var(--ink-faint); margin-top:6px;}

/* =========================================================
   APP SHELL
========================================================= */
.app-shell{display:flex; min-height:100vh; background:var(--bg);}
.sidebar{width:240px; flex:0 0 auto; background:#fff; border-inline-end:1px solid var(--line); display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;}
.sidebar-logo{padding:8px 10px 22px;}
.side-nav{display:flex; flex-direction:column; gap:2px; flex:1;}
.side-link{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; font-size:14px; font-weight:600; color:var(--ink-soft);}
.side-link svg{flex:0 0 auto; opacity:.75;}
.side-link:hover{background:var(--bg);}
.side-link.active{background:var(--lav); color:var(--purple-deep);}
.side-link.active svg{opacity:1;}
.side-sep{height:1px; background:var(--line); margin:14px 4px;}
.side-foot{display:flex; flex-direction:column; gap:2px;}
.side-user{display:flex; align-items:center; gap:10px; padding:10px 10px; margin-top:6px; border-radius:12px; background:var(--bg);}
.avatar{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,var(--purple),var(--purple-deep)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:0 0 auto;}
.side-user b{display:block; font-size:13px; color:var(--navy);}
.side-user span{font-size:11.5px; color:var(--ink-faint);}
.mobile-sidebar-toggle{display:none;}
@media (max-width:900px){
  .sidebar{position:fixed; inset-inline-start:-260px; z-index:150; transition:inset-inline-start .2s; box-shadow:var(--shadow-lg);}
  .sidebar.open{inset-inline-start:0;}
  .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(15,27,61,.35); z-index:140;}
  .sidebar-scrim.open{display:block;}
  .mobile-sidebar-toggle{display:flex;}
}
.app-main{flex:1; min-width:0;}
.app-topbar{position:sticky; top:0; z-index:40; background:rgba(243,245,250,.85); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:14px 26px; gap:14px;}
@media (max-width:720px){ .app-topbar{padding:12px 16px;} }
.topbar-left{display:flex; align-items:center; gap:12px; flex:1; min-width:0;}
.icon-btn{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex:0 0 auto;}
.icon-btn:hover{border-color:var(--purple); color:var(--purple-deep);}
.search-box{display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:11px; padding:9px 13px; max-width:320px; flex:1; color:var(--ink-faint);}
.search-box input{border:none; outline:none; font-size:13.5px; width:100%; background:transparent; font-family:inherit; color:var(--ink);}
.topbar-right{display:flex; align-items:center; gap:10px;}
.app-content{padding:26px; max-width:1320px;}
@media (max-width:720px){ .app-content{padding:18px 16px;} }
.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:24px; gap:14px; flex-wrap:wrap;}
.page-head h1{font-size:24px; color:var(--navy);}
.page-head p{margin-top:6px; font-size:14px; color:var(--ink-faint);}

/* KPI */
.kpi-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-bottom:24px;}
@media (max-width:1180px){ .kpi-grid{grid-template-columns:repeat(3,1fr);} }
@media (max-width:640px){ .kpi-grid{grid-template-columns:1fr 1fr;} }
.kpi{background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px;}
.kpi-label{font-size:12px; color:var(--ink-faint); font-weight:600;}
.kpi-val{font-size:23px; font-weight:800; color:var(--navy); margin-top:8px;}
.kpi-delta{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; margin-top:8px; padding:3px 8px; border-radius:999px;}
.kpi-delta.up{color:#1D8656; background:#E3F7EC;}
.kpi-delta.down{color:#B3405A; background:#FBE7EB;}

.grid2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px;}
@media (max-width:980px){ .grid2{grid-template-columns:1fr;} }
.panel-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.panel-title h3{font-size:15.5px; color:var(--navy);}
.panel-title span{font-size:12px; color:var(--ink-faint);}

.insight-card{border:1px solid var(--line); border-radius:16px; padding:16px; background:linear-gradient(180deg,#fff,var(--bg)); display:flex; gap:12px; align-items:flex-start; margin-bottom:10px;}
.insight-card svg{flex:0 0 auto; color:var(--purple-deep); margin-top:2px;}
.insight-card p{font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
.insight-card p b{color:var(--navy);}

/* segment cards */
.seg-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:980px){ .seg-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:620px){ .seg-grid{grid-template-columns:1fr;} }
.seg-card{background:#fff; border:1px solid var(--line); border-radius:20px; padding:22px; display:flex; flex-direction:column; gap:12px; cursor:pointer; transition:box-shadow .2s, border-color .2s;}
.seg-card:hover{box-shadow:var(--shadow-md); border-color:#CFC9FF;}
.seg-top{display:flex; align-items:center; justify-content:between; gap:10px;}
.seg-num{width:36px; height:36px; border-radius:11px; background:var(--lav); color:var(--purple-deep); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
.seg-card h4{font-size:16px; color:var(--navy); margin-top:2px;}
.seg-meta{display:flex; gap:16px; margin-top:4px;}
.seg-meta div{font-size:11.5px; color:var(--ink-faint);}
.seg-meta b{display:block; font-size:15px; color:var(--navy); font-weight:800;}
.seg-bar{height:6px; border-radius:4px; background:var(--bg); overflow:hidden;}
.seg-bar i{display:block; height:100%; background:linear-gradient(90deg,var(--purple),var(--purple-deep)); border-radius:4px;}
.seg-tags{display:flex; gap:6px; flex-wrap:wrap;}

/* persona cards */
.persona-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
@media (max-width:980px){ .persona-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:620px){ .persona-grid{grid-template-columns:1fr;} }
.persona-card{background:#fff; border:1px solid var(--line); border-radius:20px; overflow:hidden;}
.persona-head{padding:22px; background:linear-gradient(150deg,var(--navy),#22305c); color:#fff; position:relative;}
.persona-avatar{width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,var(--purple),#fff2); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; margin-bottom:12px; border:2px solid rgba(255,255,255,.3);}
.persona-head h4{font-size:17px;}
.persona-head span{font-size:12.5px; color:#B9C0DA;}
.persona-body{padding:20px;}
.persona-row{display:flex; justify-content:space-between; font-size:12.5px; padding:8px 0; border-bottom:1px dashed var(--line);}
.persona-row b{color:var(--navy); font-weight:700;}
.persona-row span{color:var(--ink-faint);}
.persona-quote{margin-top:14px; padding:12px 14px; border-radius:12px; background:var(--lav); font-size:12.5px; color:var(--purple-deep); font-style:italic; line-height:1.5;}
.persona-foot{display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--line);}

/* table */
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:18px; background:#fff;}
table.tbl{width:100%; border-collapse:collapse; min-width:680px;}
table.tbl th{text-align:start; font-size:11.5px; text-transform:none; color:var(--ink-faint); font-weight:700; padding:14px 16px; border-bottom:1px solid var(--line); background:var(--bg);}
table.tbl td{padding:14px 16px; font-size:13.5px; color:var(--ink-soft); border-bottom:1px solid var(--line);}
table.tbl tr:last-child td{border-bottom:none;}
table.tbl td b{color:var(--navy);}

/* filters */
.filter-row{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px;}
.filter-chip{display:flex; align-items:center; gap:6px; padding:8px 13px; border-radius:10px; background:#fff; border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--ink-soft);}
.filter-chip select{border:none; background:transparent; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-soft);}

/* tabs */
.tabs{display:flex; gap:6px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:4px; width:fit-content; margin-bottom:20px; flex-wrap:wrap;}
.tab-btn{padding:8px 16px; border-radius:9px; border:none; background:transparent; font-size:13px; font-weight:700; color:var(--ink-faint);}
.tab-btn.active{background:var(--navy); color:#fff;}

/* forms in app */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:700px){ .form-grid{grid-template-columns:1fr;} }

/* AI chat */
.chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 210px); min-height:420px; background:#fff; border:1px solid var(--line); border-radius:20px; overflow:hidden;}
.chat-head{padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px;}
.chat-ai-avatar{width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,var(--purple),var(--purple-deep)); display:flex; align-items:center; justify-content:center; color:#fff;}
.chat-body{flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:14px;}
.msg{max-width:76%; padding:13px 16px; border-radius:16px; font-size:14px; line-height:1.55;}
.msg-ai{background:var(--bg); color:var(--ink); align-self:flex-start; border-bottom-left-radius:4px;}
html[dir="rtl"] .msg-ai{border-bottom-left-radius:16px; border-bottom-right-radius:4px;}
.msg-user{background:var(--navy); color:#fff; align-self:flex-end; border-bottom-right-radius:4px;}
html[dir="rtl"] .msg-user{border-bottom-right-radius:16px; border-bottom-left-radius:4px;}
.chat-suggestions{display:flex; gap:8px; padding:0 20px 16px; flex-wrap:wrap;}
.sugg-chip{padding:8px 14px; border-radius:999px; background:var(--lav); color:var(--purple-deep); font-size:12.5px; font-weight:600; border:none;}
.chat-input-row{display:flex; gap:10px; padding:16px 20px; border-top:1px solid var(--line);}
.chat-input-row input{flex:1; border:1.5px solid var(--line); border-radius:12px; padding:12px 15px; font-size:14px; font-family:inherit;}

/* import wizard */
.modal-overlay{position:fixed; inset:0; background:rgba(15,27,61,.45); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal-box{background:#fff; border-radius:24px; max-width:520px; width:100%; padding:30px; box-shadow:var(--shadow-lg); max-height:88vh; overflow-y:auto;}
.wiz-steps{display:flex; gap:6px; margin-bottom:22px;}
.wiz-steps i{flex:1; height:4px; border-radius:3px; background:var(--line);}
.wiz-steps i.done{background:var(--purple);}
.progress-line{display:flex; align-items:center; gap:10px; padding:10px 0; font-size:13.5px; color:var(--ink-faint);}
.progress-line.done{color:var(--navy); font-weight:600;}
.progress-line .pc{width:20px; height:20px; border-radius:50%; border:2px solid var(--line); flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
.progress-line.done .pc{background:var(--good); border-color:var(--good); color:#fff;}
.progress-line.active .pc{border-color:var(--purple);}

/* empty state */
.empty-state{text-align:center; padding:60px 24px; background:#fff; border:1.5px dashed var(--line); border-radius:22px;}
.empty-state svg{color:var(--purple); margin-bottom:14px;}
.empty-state h3{font-size:16px; color:var(--navy);}
.empty-state p{font-size:13.5px; color:var(--ink-faint); margin-top:8px; max-width:340px; margin-inline:auto;}

/* legal pages */
.legal-body h2{font-size:18px; color:var(--navy); margin-top:32px;}
.legal-body h2:first-child{margin-top:0;}
.legal-body p, .legal-body li{font-size:14px; color:var(--ink-soft); line-height:1.7; margin-top:10px;}
.legal-note{background:var(--lav); border-radius:16px; padding:16px 18px; font-size:13px; color:var(--purple-deep); margin-bottom:30px; line-height:1.6;}

/* misc */
.divider{height:1px; background:var(--line); margin:20px 0;}
.skeleton{background:linear-gradient(90deg,#EEF0F7,#F7F8FB,#EEF0F7); background-size:200% 100%; animation:sk 1.3s infinite;}
@keyframes sk{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.fade-up{animation:fadeUp .5s ease both;}
@keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ }
}
</style>

/* =========================================================
   SVG CHART HELPERS
========================================================= */
function barChart(data, opts={}){
  const w = opts.w||520, h = opts.h||220, pad=36;
  const max = Math.max(...data.map(d=>d.v)) * 1.15;
  const bw = (w - pad*2) / data.length;
  let bars='', labels='';
  data.forEach((d,i)=>{
    const bh = (d.v/max) * (h-pad-20);
    const x = pad + i*bw + bw*0.18;
    const bwid = bw*0.64;
    const y = h-pad - bh;
    bars += `<rect x="${x}" y="${y}" width="${bwid}" height="${bh}" rx="7" fill="${d.color||'#7B6CFF'}"><title>${d.label}: ${d.v}</title></rect>`;
    bars += `<text x="${x+bwid/2}" y="${y-8}" text-anchor="middle" font-size="11" font-weight="700" fill="#0F1B3D">${d.vLabel!==undefined?d.vLabel:d.v}</text>`;
    labels += `<text x="${x+bwid/2}" y="${h-12}" text-anchor="middle" font-size="10.5" fill="#8891AB">${d.label}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">
    <line x1="${pad}" y1="${h-pad}" x2="${w-10}" y2="${h-pad}" stroke="#E3E7F1"/>
    ${bars}${labels}
  </svg>`;
}
function donut(data, opts={}){
  const size = opts.size||190, r=size/2-16, cx=size/2, cy=size/2, stroke=26;
  const total = data.reduce((a,b)=>a+b.v,0);
  let acc=0, segs='';
  data.forEach(d=>{
    const frac=d.v/total; const circ = 2*Math.PI*r;
    const dash = frac*circ;
    const offset = circ - acc*circ;
    segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-acc*circ}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"><title>${d.label}: ${d.v}</title></circle>`;
    acc += frac;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${segs}<circle cx="${cx}" cy="${cy}" r="${r-stroke/2-2}" fill="#fff"/></svg>`;
}
function lineChart(points, opts={}){
  const w=opts.w||520,h=opts.h||200,pad=30;
  const max=Math.max(...points.map(p=>p.v))*1.15, min=Math.min(...points.map(p=>p.v))*0.85;
  const stepX = (w-pad*2)/(points.length-1);
  const y = v => h-pad - ((v-min)/(max-min))*(h-pad*2);
  let path='', dots='', labels='';
  points.forEach((p,i)=>{
    const x = pad+i*stepX;
    path += (i===0?'M':'L')+x+' '+y(p.v)+' ';
    dots += `<circle cx="${x}" cy="${y(p.v)}" r="4" fill="#7B6CFF"/>`;
    labels += `<text x="${x}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#8891AB">${p.label}</text>`;
  });
  const area = path + `L ${pad+(points.length-1)*stepX} ${h-pad} L ${pad} ${h-pad} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px">
    <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6CFF" stop-opacity=".28"/><stop offset="1" stop-color="#7B6CFF" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#lg1)"/>
    <path d="${path}" fill="none" stroke="#7B6CFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
  </svg>`;
}

function setLang(l){ state.lang = l; document.documentElement.lang = l; document.documentElement.dir = T[l].dir; render(); }

function render(){
  const root = document.getElementById('root');
  const r = state.route.replace('#','') || '/';
  document.documentElement.dir = t().dir;
  document.documentElement.lang = state.lang;
  document.body.style.fontFamily = isAr() ? "var(--font-ar)" : "var(--font-en)";

  if(r.startsWith('/app')){ root.innerHTML = renderApp(r); afterAppRender(r); }
  else if(r==='/login'){ root.innerHTML = renderLogin(); }
  else if(r==='/signup'){ root.innerHTML = renderSignup(); }
  else { root.innerHTML = renderPublic(r); afterPublicRender(); }

  renderCookieBar();
}

function renderApp(route){
  const seg = route.split('/')[2] || 'dashboard';
  if(seg==='dashboard') return appShell('dashboard', pageDashboard());
  if(seg==='customers') return appShell('customers', pageCustomers());
  if(seg==='behavior') return appShell('behavior', pageBehavior());
  if(seg==='segments'){
    const sub = route.split('/')[3];
    return sub ? appShell('segments', pageSegmentDetail(sub)) : appShell('segments', pageSegments());
  }
  if(seg==='personas') return appShell('personas', pagePersonas());
  if(seg==='value') return appShell('value', pageValue());
  if(seg==='campaigns') return appShell('campaigns', pageCampaigns());
  if(seg==='ai') return appShell('ai', pageAIStrategist());
  if(seg==='reports') return appShell('reports', pageReports());
  if(seg==='settings') return appShell('settings', pageSettings());
  return appShell('dashboard', pageDashboard());
}

function chatAnswer(q){
  const ql = q.toLowerCase();
  const topRev = SEGMENTS.slice().sort((a,b)=>b.revenueShare-a.revenueShare)[0];
  const atrisk = SEGMENTS.find(s=>s.id==='atrisk');
  const hv = SEGMENTS.find(s=>s.id==='highvalue');
  const conv = SEGMENTS.find(s=>s.id==='convenience');
  if(ql.includes('revenue') || ql.includes('إيراد')) return tr(`<b>${topRev.nameEn}</b> generate the most revenue, contributing ${topRev.revenueShare}% of total revenue from just ${topRev.share}% of your customer base, a strong indicator of high lifetime value.`, `تحقق شريحة <b>${topRev.nameAr}</b> أعلى الإيرادات، بمساهمة ${topRev.revenueShare}٪ من إجمالي الإيرادات من ${topRev.share}٪ فقط من قاعدة عملائك، مؤشر قوي على القيمة الدائمة العالية.`);
  if(ql.includes('leav') || ql.includes('churn') || ql.includes('غادر')) return tr(`Your <b>${atrisk.nameEn}</b> segment (${fmt(atrisk.size)} customers) shows engagement of only ${atrisk.engagement}% and retention of ${atrisk.retention}%. The most common signal is inactivity beyond 60 days, a win-back offer tends to perform best here.`, `تُظهر شريحة <b>${atrisk.nameAr}</b> (${fmt(atrisk.size)} عميل) تفاعلاً بنسبة ${atrisk.engagement}٪ فقط ومعدل احتفاظ ${atrisk.retention}٪. الإشارة الأكثر شيوعاً هي عدم النشاط لأكثر من 60 يوماً، يميل عرض الاستعادة إلى الأداء الأفضل هنا.`);
  if(ql.includes('price') || ql.includes('discount') || ql.includes('سعر') || ql.includes('خصم')){ const deal=SEGMENTS.find(s=>s.id==='deal'); return tr(`<b>${deal.nameEn}</b> are the most price-sensitive group, they respond strongly to time-bound offers and bundles, and make up ${deal.share}% of your customer base.`, `شريحة <b>${deal.nameAr}</b> هي الأكثر حساسية للسعر، تستجيب بقوة للعروض المحدودة زمنياً والباقات، وتشكل ${deal.share}٪ من قاعدة عملائك.`); }
  if(ql.includes('high-value') || ql.includes('high value') || ql.includes('قيمة عالية')) return tr(`Your <b>${hv.nameEn}</b> segment responds best to premium service and exclusivity rather than discounts. Consider a dedicated contact line and early access to new products.`, `تستجيب شريحة <b>${hv.nameAr}</b> بشكل أفضل للخدمة المتميزة والحصرية بدلاً من الخصومات. فكّر في خط تواصل مخصص ووصول مبكر للمنتجات الجديدة.`);
  if(ql.includes('convenience') || ql.includes('راحة')) return tr(`Here's a starting point for <b>${conv.nameEn}</b>: lead with speed and simplicity, not price. Try "${conv.campaignsEn[0]}" as a campaign name, delivered via mobile push and SMS.`, `نقطة انطلاق لشريحة <b>${conv.nameAr}</b>: ركّز على السرعة والبساطة، وليس السعر. جرّب "${conv.campaignsAr[0]}" كاسم للحملة، عبر إشعارات الجوال والرسائل النصية.`);
  if(ql.includes('pain')) return tr(`Common pain points across your base include long delivery windows, complicated checkout, and generic (non-personalized) offers, most acute in the Convenience Seekers and Deal Seekers segments.`, `تشمل نقاط الألم الشائعة عبر قاعدة عملائك فترات توصيل طويلة، وخطوات دفع معقدة، وعروضاً عامة غير مخصصة، وهي الأكثر حدة في شرائح الباحثين عن الراحة والباحثين عن العروض.`);
  return tr(`Based on your demo data, I'd start by looking at your <b>${topRev.nameEn}</b> and <b>${atrisk.nameEn}</b> segments, one drives revenue, the other needs attention. Ask me about revenue, churn, pricing or a specific segment for more detail.`, `بناءً على بياناتك التجريبية، أقترح البدء بالنظر إلى شريحتي <b>${topRev.nameAr}</b> و<b>${atrisk.nameAr}</b>, إحداهما تقود الإيرادات والأخرى بحاجة لاهتمام. اسألني عن الإيرادات أو فقدان العملاء أو التسعير أو شريحة معينة لمزيد من التفاصيل.`);
}
function chatAsk(q){
  if(!q || !q.trim()) return;
  state.chatMsgs.push({role:'user', text:q});
  state.chatMsgs.push({role:'ai', text:chatAnswer(q)});
  render();
  setTimeout(()=>{ const b=document.getElementById('chatBody'); if(b) b.scrollTop=b.scrollHeight; },30);
}

/* =========================================================
   IMPORT / DATA WIZARD (demo)
========================================================= */
let wizStep = 1;
function openImportWizard(){
  wizStep=1;
  const el = document.createElement('div');
  el.id='wizOverlay'; el.className='modal-overlay';
  el.onclick = (e)=>{ if(e.target===el) closeWizard(); };
  document.body.appendChild(el);
  renderWizard();
}
function closeWizard(){ const el=document.getElementById('wizOverlay'); if(el) el.remove(); }
function renderWizard(){
  const el = document.getElementById('wizOverlay'); if(!el) return;
  let inner='';
  if(wizStep===1){
    inner = `
    <h3 style="color:var(--navy); font-size:18px;">${tr('Connect your data','اربط بياناتك')}</h3>
    <p style="font-size:13px; color:var(--ink-faint); margin-top:6px;">${tr('Upload a CSV or Excel file to get started.','ارفع ملف CSV أو Excel للبدء.')}</p>
    <div style="margin-top:20px; border:1.5px dashed var(--line); border-radius:16px; padding:34px; text-align:center; color:var(--ink-faint);">
      ${ic.upload}<p style="margin-top:10px; font-size:13px;">${tr('Drop your file here, or click to browse','اسحب ملفك هنا أو انقر للتصفح')}</p>
      <p style="font-size:11.5px; margin-top:6px;">CSV, XLSX</p>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="wizStep=2; renderWizard();">${tr('Continue with sample data','المتابعة ببيانات نموذجية')}</button>`;
  } else if(wizStep===2){
    const cols = ['customer_id','purchase_date','purchase_value','product','channel','location','campaign','engagement'];
    inner = `
    <h3 style="color:var(--navy); font-size:18px;">${tr('Map columns','ربط الأعمدة')}</h3>
    <p style="font-size:13px; color:var(--ink-faint); margin-top:6px;">${tr('We matched these automatically, adjust if needed.','قمنا بمطابقة هذه تلقائياً، عدّلها إن لزم الأمر.')}</p>
    <div style="margin-top:16px; display:flex; flex-direction:column; gap:8px; max-height:260px; overflow-y:auto;">
      ${cols.map(c=>`<div style="display:flex; align-items:center; justify-content:space-between; background:var(--bg); border-radius:10px; padding:9px 12px; font-size:13px;"><span style="font-family:monospace; color:var(--ink-soft);">${c}</span>${ic.check}</div>`).join('')}
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="wizStep=3; renderWizard(); setTimeout(runAnalysisAnim,150);">${tr('Validate & Continue','التحقق والمتابعة')}</button>`;
  } else if(wizStep===3){
    inner = `
    <h3 style="color:var(--navy); font-size:18px;">${tr('Analyzing customer behavior…','جارٍ تحليل سلوك العملاء…')}</h3>
    <div id="wizProgress" style="margin-top:18px;">
      ${['Importing data','Cleaning data','Analyzing behavior','Finding patterns','Creating segments','Generating insights'].map((l,i)=>`
      <div class="progress-line" id="pl${i}"><div class="pc"></div>${tr(l, ['استيراد البيانات','تنظيف البيانات','تحليل السلوك','اكتشاف الأنماط','إنشاء الشرائح','توليد الرؤى'][i])}</div>`).join('')}
    </div>`;
  } else {
    inner = `
    <div style="text-align:center; padding:10px 0;">
      <div style="color:var(--good); margin-bottom:10px;">${ic.check}</div>
      <h3 style="color:var(--navy); font-size:19px;">${tr('Your first 6 behavioral segments are ready.','أصبحت أول 6 شرائح سلوكية جاهزة.')}</h3>
      <p style="font-size:13px; color:var(--ink-faint); margin-top:8px;">${tr('Sulok analyzed your demo dataset and discovered 6 meaningful customer groups.','حلّل سلوك مجموعة بياناتك التجريبية واكتشف 6 مجموعات عملاء ذات معنى.')}</p>
      <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="closeWizard(); nav('#/app/segments');">${tr('View Segments','عرض الشرائح')}</button>
    </div>`;
  }
  el.innerHTML = `<div class="modal-box">
    <div class="wiz-steps">${[1,2,3,4].map(i=>`<i class="${wizStep>=i?'done':''}"></i>`).join('')}</div>
    ${inner}
    ${wizStep<4?`<button class="btn btn-text btn-block" style="margin-top:8px;" onclick="closeWizard()">${tr('Cancel','إلغاء')}</button>`:''}
  </div>`;
}
function runAnalysisAnim(){
  let i=0;
  const iv = setInterval(()=>{
    const el = document.getElementById('pl'+i);
    if(el){ el.classList.add('done'); el.classList.remove('active'); }
    i++;
    const next = document.getElementById('pl'+i);
    if(next) next.classList.add('active');
    if(i>=6){ clearInterval(iv); setTimeout(()=>{ wizStep=4; renderWizard(); }, 500); }
  }, 480);
}

/* =========================================================
   INIT
========================================================= */
render();
